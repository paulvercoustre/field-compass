name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Least privilege by default; only the job that publishes widens this.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/field-compass-backend

jobs:
  # ============================================
  # Job 1: Unit Tests & Code Quality (Fast Feedback)
  # ============================================
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install linting tools
        pip install ruff==0.1.15
    
    - name: Lint with ruff
      working-directory: ./backend
      run: |
        # Check for linting errors
        ruff check . --output-format=github
      continue-on-error: false
    
    - name: Format check with ruff
      working-directory: ./backend
      run: |
        # Check if code is properly formatted
        ruff format --check .
      continue-on-error: false
    
    - name: Run unit tests
      working-directory: ./backend
      run: |
        pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term
      env:
        # Tests use SQLite in-memory, no DATABASE_URL needed
        DATABASE_URL: "sqlite:///:memory:"
    
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: backend/coverage.xml

  # ============================================
  # Job 2: Build Docker Image
  # ============================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    timeout-minutes: 15
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # Only needed to publish. Pull requests never publish, and a fork PR's
    # token is read-only, so logging in there would fail for no benefit.
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    # Always build, so every PR is compiled and tested -- but into the local
    # daemon only. Publishing a PR's image would turn untrusted contributor
    # code into a durable, pullable artifact in the registry.
    - name: Build image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: field-compass-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    # Handed to test-in-docker as an artifact so that job tests THIS commit's
    # image, with no registry round-trip and nothing to fall back to.
    - name: Export image for the test job
      run: docker save field-compass-backend:ci -o /tmp/backend-image.tar
    
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-image
        path: /tmp/backend-image.tar
        retention-days: 1
    
    - name: Publish image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
    
    - name: Output image info
      if: github.event_name != 'pull_request'
      run: |
        echo "Image published:"
        echo "${{ steps.meta.outputs.tags }}"

  # ============================================
  # Job 3: Test in Docker Container
  # ============================================
  test-in-docker:
    name: Test in Docker
    runs-on: ubuntu-latest
    needs: build-docker
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: field_compass_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # The image comes from the build job as an artifact, NOT from the registry.
    # The previous version pulled by tag and fell back to :latest when the tag
    # was missing -- which health-checked the CURRENT PRODUCTION image and
    # reported success for code that was never in the commit under test.
    # There is deliberately no fallback here: if the artifact is missing the
    # job fails, because a green tick must mean this commit was tested.
    - name: Download image built from this commit
      uses: actions/download-artifact@v4
      with:
        name: backend-image
        path: /tmp
    
    - name: Load image
      run: |
        docker load -i /tmp/backend-image.tar
        docker image inspect field-compass-backend:ci > /dev/null
        echo "Loaded image built from ${{ github.sha }}"
    
    - name: Wait for PostgreSQL
      run: |
        # Install PostgreSQL client if not available
        sudo apt-get update && sudo apt-get install -y postgresql-client || true
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Initialize test database
      run: |
        # Install PostgreSQL client if not available
        sudo apt-get update && sudo apt-get install -y postgresql-client || true
        PGPASSWORD=postgres psql -h localhost -U postgres -d field_compass_test -f backend/database/schema.sql
    
    - name: Health check test
      run: |
        IMAGE="field-compass-backend:ci"
        
        echo "Testing image: $IMAGE"
        
        # Start container in background with network access to host PostgreSQL
        CONTAINER_ID=$(docker run -d \
          --add-host=host.docker.internal:host-gateway \
          -p 8001:8000 \
          -e DATABASE_URL="postgresql://postgres:postgres@host.docker.internal:5432/field_compass_test" \
          -e ENVIRONMENT="test" \
          $IMAGE)
        
        echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
        
        # Wait for container to start
        echo "Waiting for container to start..."
        sleep 10
        
        # Show container logs for debugging
        echo "=== Container logs ==="
        docker logs $CONTAINER_ID || true
        echo "======================"
        
        # Test health endpoint with retries
        MAX_RETRIES=30
        RETRY_COUNT=0
        HEALTH_CHECK_PASSED=false
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -f -s http://localhost:8001/health > /dev/null 2>&1; then
            HEALTH_CHECK_PASSED=true
            break
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "Waiting for health endpoint... ($RETRY_COUNT/$MAX_RETRIES)"
          sleep 2
        done
        
        if [ "$HEALTH_CHECK_PASSED" = false ]; then
          echo "✗ Health endpoint not responding after $MAX_RETRIES attempts"
          echo "=== Final container logs ==="
          docker logs $CONTAINER_ID
          docker stop $CONTAINER_ID || true
          docker rm $CONTAINER_ID || true
          exit 1
        fi
        
        # Get and verify health response
        HEALTH_RESPONSE=$(curl -s http://localhost:8001/health)
        echo "Health response: $HEALTH_RESPONSE"
        
        # Verify status
        if echo "$HEALTH_RESPONSE" | grep -q '"status":"healthy"'; then
          echo "✓ Health check endpoint working"
        else
          echo "✗ Health check returned unhealthy status"
          echo "Response: $HEALTH_RESPONSE"
          docker logs $CONTAINER_ID
          docker stop $CONTAINER_ID || true
          docker rm $CONTAINER_ID || true
          exit 1
        fi
        
        # Test database connection (optional - may fail if DB not accessible from container)
        if echo "$HEALTH_RESPONSE" | grep -q '"database":"connected"'; then
          echo "✓ Database connection working"
        else
          echo "⚠ Database connection not verified (may be expected in test environment)"
          echo "Response: $HEALTH_RESPONSE"
        fi
        
        # Cleanup
        docker stop $CONTAINER_ID || true
        docker rm $CONTAINER_ID || true
        echo "✓ Container tests passed"
    
    # NOTE: there is intentionally no "integration tests" step here yet. The
    # previous one only ran `echo "Integration tests passed"`, so it reported
    # success unconditionally and gave the pipeline a green tick it had not
    # earned. The health check above is the real gate. Add genuine integration
    # tests here when they exist -- a step that cannot fail is worse than none.

  # Note: Deployment is intentionally not handled here.
  # For demos, we deploy using an Azure VM + docker-compose.prod.yml (see VM_DEPLOYMENT_AZURE.md).


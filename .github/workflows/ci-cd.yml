name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Least privilege by default; only the job that publishes widens this.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/field-compass-backend

jobs:
  # ============================================
  # Job 1: Unit Tests & Code Quality (Fast Feedback)
  # ============================================
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install linting tools
        pip install ruff==0.1.15
    
    - name: Lint with ruff
      working-directory: ./backend
      run: |
        # Check for linting errors
        ruff check . --output-format=github
      continue-on-error: false
    
    - name: Format check with ruff
      working-directory: ./backend
      run: |
        # Check if code is properly formatted
        ruff format --check .
      continue-on-error: false
    
    - name: Run unit tests
      working-directory: ./backend
      run: |
        pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term
      env:
        # Tests use SQLite in-memory, no DATABASE_URL needed
        DATABASE_URL: "sqlite:///:memory:"
    
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: backend/coverage.xml

  # ============================================
  # Job 2: Build Docker Image
  # ============================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    timeout-minutes: 15
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # Only needed to publish. Pull requests never publish, and a fork PR's
    # token is read-only, so logging in there would fail for no benefit.
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    # Always build, so every PR is compiled and tested -- but into the local
    # daemon only. Publishing a PR's image would turn untrusted contributor
    # code into a durable, pullable artifact in the registry.
    - name: Build image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: field-compass-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    # Handed to test-in-docker as an artifact so that job tests THIS commit's
    # image, with no registry round-trip and nothing to fall back to.
    - name: Export image for the test job
      run: docker save field-compass-backend:ci -o /tmp/backend-image.tar
    
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-image
        path: /tmp/backend-image.tar
        retention-days: 1
    
    - name: Publish image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
    
    - name: Output image info
      if: github.event_name != 'pull_request'
      run: |
        echo "Image published:"
        echo "${{ steps.meta.outputs.tags }}"

  # ============================================
  # Job 3: Test in Docker Container
  # ============================================
  test-in-docker:
    name: Test in Docker
    runs-on: ubuntu-latest
    needs: build-docker
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: field_compass_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # The image comes from the build job as an artifact, NOT from the registry.
    # The previous version pulled by tag and fell back to :latest when the tag
    # was missing -- which health-checked the CURRENT PRODUCTION image and
    # reported success for code that was never in the commit under test.
    # There is deliberately no fallback here: if the artifact is missing the
    # job fails, because a green tick must mean this commit was tested.
    - name: Download image built from this commit
      uses: actions/download-artifact@v4
      with:
        name: backend-image
        path: /tmp
    
    - name: Load image
      run: |
        docker load -i /tmp/backend-image.tar
        docker image inspect field-compass-backend:ci > /dev/null
        echo "Loaded image built from ${{ github.sha }}"
    
    - name: Wait for PostgreSQL
      run: |
        # Install PostgreSQL client if not available
        sudo apt-get update && sudo apt-get install -y postgresql-client || true
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Initialize test database
      run: |
        # Install PostgreSQL client if not available
        sudo apt-get update && sudo apt-get install -y postgresql-client || true
        PGPASSWORD=postgres psql -h localhost -U postgres -d field_compass_test \
          -v ON_ERROR_STOP=1 -f backend/database/schema.sql

        # Production applies this on every deploy, against a database that
        # already exists. Running it here on a database schema.sql just built
        # proves it is valid SQL and safe to re-run -- if it is not, CI fails
        # instead of the deploy.
        PGPASSWORD=postgres psql -h localhost -U postgres -d field_compass_test \
          -v ON_ERROR_STOP=1 -f backend/database/migrations/006_sync_schema_with_models.sql
    
    - name: Health check test
      run: |
        IMAGE="field-compass-backend:ci"
        
        echo "Testing image: $IMAGE"
        
        # Start container in background with network access to host PostgreSQL
        CONTAINER_ID=$(docker run -d \
          --add-host=host.docker.internal:host-gateway \
          -p 8001:8000 \
          -e DATABASE_URL="postgresql://postgres:postgres@host.docker.internal:5432/field_compass_test" \
          -e ENVIRONMENT="test" \
          $IMAGE)
        
        echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
        
        # Wait for container to start
        echo "Waiting for container to start..."
        sleep 10
        
        # Show container logs for debugging
        echo "=== Container logs ==="
        docker logs $CONTAINER_ID || true
        echo "======================"
        
        # Test health endpoint with retries
        MAX_RETRIES=30
        RETRY_COUNT=0
        HEALTH_CHECK_PASSED=false
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -f -s http://localhost:8001/health > /dev/null 2>&1; then
            HEALTH_CHECK_PASSED=true
            break
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "Waiting for health endpoint... ($RETRY_COUNT/$MAX_RETRIES)"
          sleep 2
        done
        
        if [ "$HEALTH_CHECK_PASSED" = false ]; then
          echo "✗ Health endpoint not responding after $MAX_RETRIES attempts"
          echo "=== Final container logs ==="
          docker logs $CONTAINER_ID
          docker stop $CONTAINER_ID || true
          docker rm $CONTAINER_ID || true
          exit 1
        fi
        
        # Get and verify health response
        HEALTH_RESPONSE=$(curl -s http://localhost:8001/health)
        echo "Health response: $HEALTH_RESPONSE"
        
        # Verify status
        if echo "$HEALTH_RESPONSE" | grep -q '"status":"healthy"'; then
          echo "✓ Health check endpoint working"
        else
          echo "✗ Health check returned unhealthy status"
          echo "Response: $HEALTH_RESPONSE"
          docker logs $CONTAINER_ID
          docker stop $CONTAINER_ID || true
          docker rm $CONTAINER_ID || true
          exit 1
        fi
        
        # Test database connection (optional - may fail if DB not accessible from container)
        if echo "$HEALTH_RESPONSE" | grep -q '"database":"connected"'; then
          echo "✓ Database connection working"
        else
          echo "⚠ Database connection not verified (may be expected in test environment)"
          echo "Response: $HEALTH_RESPONSE"
        fi
        
        # --- Authentication smoke test --------------------------------
        # This is the check that was missing. The health endpoint only runs
        # "SELECT 1", so it reported healthy against a database that had no
        # `users` table at all, while every registration and login returned a
        # 500. Anything that touches a real table has to be exercised here,
        # because this is the only job that builds the database the way
        # production does -- from schema.sql.
        fail_with_logs() {
          echo "::error::$1"
          shift
          for f in "$@"; do [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; echo; }; done
          echo "=== container logs ==="
          docker logs $CONTAINER_ID || true
          docker stop $CONTAINER_ID || true
          docker rm $CONTAINER_ID || true
          exit 1
        }

        SUFFIX="$(date +%s)$RANDOM"
        EMAIL="ci-${SUFFIX}@example.com"
        USERNAME="ci-${SUFFIX}"
        PASSWORD="CiT3stPassw0rd!"

        REGISTER_STATUS=$(curl -s -o /tmp/register.json -w '%{http_code}' \
          -X POST http://localhost:8001/api/auth/register \
          -H 'Content-Type: application/json' \
          -d "{\"email\":\"${EMAIL}\",\"username\":\"${USERNAME}\",\"password\":\"${PASSWORD}\"}")

        [ "$REGISTER_STATUS" = "201" ] \
          || fail_with_logs "POST /api/auth/register returned $REGISTER_STATUS, expected 201" /tmp/register.json
        echo "✓ register returned 201"

        LOGIN_STATUS=$(curl -s -o /tmp/login.json -w '%{http_code}' \
          -X POST http://localhost:8001/api/auth/login \
          -d "username=${EMAIL}&password=${PASSWORD}")

        [ "$LOGIN_STATUS" = "200" ] \
          || fail_with_logs "POST /api/auth/login returned $LOGIN_STATUS, expected 200" /tmp/login.json
        echo "✓ login returned 200"

        TOKEN=$(sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' /tmp/login.json)
        [ -n "$TOKEN" ] || fail_with_logs "login response contained no access_token" /tmp/login.json

        ME_STATUS=$(curl -s -o /tmp/me.json -w '%{http_code}' \
          http://localhost:8001/api/users/me -H "Authorization: Bearer $TOKEN")

        [ "$ME_STATUS" = "200" ] \
          || fail_with_logs "GET /api/users/me returned $ME_STATUS, expected 200" /tmp/me.json
        grep -q "$EMAIL" /tmp/me.json \
          || fail_with_logs "GET /api/users/me returned a different user" /tmp/me.json
        echo "✓ token authenticates /api/users/me"

        # Cleanup
        docker stop $CONTAINER_ID || true
        docker rm $CONTAINER_ID || true
        echo "✓ Container tests passed"
    
    # NOTE: there is intentionally no "integration tests" step here yet. The
    # previous one only ran `echo "Integration tests passed"`, so it reported
    # success unconditionally and gave the pipeline a green tick it had not
    # earned. The health check above is the real gate. Add genuine integration
    # tests here when they exist -- a step that cannot fail is worse than none.

  # ============================================
  # Job 4: Deploy to the Azure VM
  # ============================================
  # Only runs for a direct push to main, and only after every preceding job has
  # gone green -- `needs` makes a failure anywhere upstream skip this entirely.
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: test-in-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20

    # Two pushes landing close together must not build on the VM at the same
    # time. Queue rather than cancel: a cancelled deploy could leave the VM
    # mid-rebuild.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    # Declaring the environment gives the deploy a URL in the Actions UI, and
    # is where you would later add a required-reviewer gate if you want deploys
    # to pause for approval.
    environment:
      name: production
      url: ${{ vars.SITE_URL || format('http://{0}/', vars.VM_HOST) }}

    steps:
    - name: Deploy over SSH
      env:
        SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        VM_HOST: ${{ vars.VM_HOST }}
        VM_USER: ${{ vars.VM_USER }}
        # Passed via env, not interpolated into the script body, so the shell
        # never parses workflow-context data as code.
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        for v in SSH_KEY KNOWN_HOSTS VM_HOST VM_USER; do
          if [ -z "${!v}" ]; then
            echo "::error::$v is not set. See VM_DEPLOYMENT_AZURE.md section 9."
            exit 1
          fi
        done

        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

        # StrictHostKeyChecking=yes with a pinned known_hosts: without it the
        # runner would trust whatever host answers on that IP.
        # The SHA is the entire command -- the key is pinned server-side to the
        # deploy script by a forced command, so nothing else would be accepted.
        ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VM_USER}@${VM_HOST}" "$TARGET_SHA"

    - name: Verify the deployed site is serving
      env:
        VM_HOST: ${{ vars.VM_HOST }}
        SITE_URL: ${{ vars.SITE_URL }}
      run: |
        set -euo pipefail
        # The VM script already health-checked from inside; this confirms the
        # site is reachable from the outside world too.
        #
        # SITE_URL is the site's canonical public URL. The fallback to the VM's
        # IP over HTTP is correct only while SITE_ADDRESS is ":80" -- once a
        # domain is configured Caddy serves that hostname and redirects HTTP to
        # HTTPS, and a request to the bare IP no longer matches any site. Set
        # the SITE_URL variable at the same time you set SITE_ADDRESS.
        BASE="${SITE_URL:-http://${VM_HOST}}"
        echo "Probing ${BASE}/health"
        RESPONSE=$(curl -fsS --max-time 15 "${BASE}/health")
        echo "Health response: $RESPONSE"
        echo "$RESPONSE" | grep -q '"status":"healthy"' \
          || { echo "::error::Site did not report healthy from outside"; exit 1; }
        echo "✓ Deployed and serving"


  # ---------------------------------------------------------------------------
  # The marketing site is deployed by Cloudflare, from site/ on main, entirely
  # outside this pipeline. Nothing here can fail when that deploy breaks, so
  # this job is the only thing watching it.
  #
  # It does NOT assert that the newest commit is live: the site has no build
  # step and so no version stamp to match against. It asserts the invariants
  # that break loudly if the deploy failed or the configuration regressed.
  # ---------------------------------------------------------------------------
  verify-marketing-site:
    name: Verify the marketing site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Probe the published site
      env:
        MARKETING_URL: ${{ vars.MARKETING_URL || 'https://fieldcompass.org' }}
        SITE_URL: ${{ vars.SITE_URL }}
      run: |
        set -euo pipefail
        BASE="${MARKETING_URL%/}"
        APP="${SITE_URL:-https://app.fieldcompass.org}"

        # Cloudflare's build runs in parallel with this workflow, so the new
        # version may not be live yet. Retry rather than race it.
        CODE=000
        for i in $(seq 1 20); do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/" || echo 000)
          if [ "$CODE" = "200" ]; then break; fi
          echo "  attempt $i: HTTP $CODE — retrying"
          sleep 6
        done
        if [ "$CODE" != "200" ]; then
          echo "::error::$BASE did not return 200 (last: $CODE)"; exit 1
        fi
        echo "✓ $BASE returns 200"

        BODY=$(curl -fsS --max-time 15 "$BASE/")
        HEADERS=$(curl -fsSI --max-time 15 "$BASE/")

        # The marketing page, not the app shell. Wrangler's framework detection
        # once deployed the React build here; this is the guard against that.
        if ! echo "$BODY" | grep -q "Data quality for KoboToolbox surveys"; then
          echo "::error::unexpected page content at $BASE"; exit 1
        fi
        if echo "$BODY" | grep -q 'id="root"'; then
          echo "::error::the app shell is being served at $BASE, not the site"; exit 1
        fi
        echo "✓ serving the marketing page"

        # site/_headers is the only thing applying these -- Caddy does not serve
        # this site. Deleting that file would otherwise fail silently.
        for h in content-security-policy x-frame-options x-content-type-options; do
          if ! echo "$HEADERS" | grep -qi "^$h:"; then
            echo "::error::missing $h header"; exit 1
          fi
        done
        echo "✓ security headers present"

        # CTAs reach the app, and no placeholder host survived a find/replace.
        if ! echo "$BODY" | grep -q "$APP"; then
          echo "::error::no links to $APP — CTAs may hold a stale host"; exit 1
        fi
        if echo "$BODY" | grep -q "app\.example\.com"; then
          echo "::error::placeholder app URL is live on the site"; exit 1
        fi
        echo "✓ CTAs point at $APP"

        # site/.assetsignore keeps these out of the upload.
        for p in set-app-url.sh README.md; do
          C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/$p" || echo 000)
          if [ "$C" != "404" ]; then
            echo "::error::/$p is publicly served (HTTP $C)"; exit 1
          fi
        done
        echo "✓ non-site files are not published"

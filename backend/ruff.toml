# Ruff configuration for Field Compass backend
# See https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 100

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults

    # DEFERRED, not dismissed. 44 call sites raise HTTPException inside an
    # except block without `from err`. Fixing it is a genuine improvement but
    # is not auto-fixable and needs a judgement per site, so it is tracked
    # separately rather than bundled into a mechanical formatting sweep.
    # Re-enable and work through the list when there is appetite for it.
    "B904",  # raise ... from err inside except
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["E501"]  # Allow long lines in tests

# Standalone CLI scripts must call sys.path.insert(0, ".") before they can
# import the application packages, so their imports legitimately come after
# executable statements.
"scripts/**/*.py" = ["E402"]

# This script's whole purpose is to verify that modules import cleanly, so the
# imports are the assertion -- they are "unused" by design.
"test_setup.py" = ["F401", "E402"]

[format]
# Use double quotes for strings
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect line length
line-ending = "auto"




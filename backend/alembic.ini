# Alembic configuration.
#
# The database URL is deliberately NOT set here. env.py reads DATABASE_URL from
# the environment and fails loudly when it is missing, so a misconfigured
# deploy cannot quietly migrate the wrong database -- or, worse, find a
# plausible default and migrate a developer's local one.

[alembic]
script_location = alembic

# Lets `from database.models import Base` resolve when alembic runs from the
# backend/ directory (which is /app in the image).
prepend_sys_path = .

# Keeps generated filenames sortable by creation time, so `ls versions/` reads
# in the same order as the revision chain.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

version_path_separator = os

sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

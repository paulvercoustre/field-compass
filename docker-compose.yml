services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: field-compass-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: field_compass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - field-compass-network

  # Schema migrations, run once before the API starts -- the same command
  # production runs, so a migration that fails does so on a laptop first.
  #
  # Postgres builds a brand-new volume from schema.sql via
  # /docker-entrypoint-initdb.d; alembic then applies anything schema.sql does
  # not already contain. On an existing volume, alembic is the only thing that
  # changes the shape of the database.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: field-compass-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/field_compass}
    volumes:
      - ./backend:/app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - field-compass-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: field-compass-api
    env_file:
      - .env  # Load environment variables from .env file
    environment:
      # Database URL (can be overridden in .env)
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/field_compass}
      # Kobo API settings (must be set in .env)
      KOBO_API_TOKEN: ${KOBO_API_TOKEN:-}
      KOBO_API_URL: ${KOBO_API_URL:-https://kf.kobotoolbox.org/api/v2}
      # OpenAI API settings (for AI-powered rule generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_RULE_GEN_MODEL: ${OPENAI_RULE_GEN_MODEL:-gpt-5}
      OPENAI_QUAL_CHECK_MODEL: ${OPENAI_QUAL_CHECK_MODEL:-gpt-5-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      # Application settings
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - field-compass-network

  # Redis broker for async jobs
  redis:
    image: redis:7-alpine
    container_name: field-compass-redis
    ports:
      - "6379:6379"
    networks:
      - field-compass-network

  # Celery worker for qualitative checks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: field-compass-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/field_compass}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_RULE_GEN_MODEL: ${OPENAI_RULE_GEN_MODEL:-gpt-5}
      OPENAI_QUAL_CHECK_MODEL: ${OPENAI_QUAL_CHECK_MODEL:-gpt-5-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: celery -A services.job_queue.celery_app worker --loglevel=INFO -Q qualitative_checks
    networks:
      - field-compass-network

networks:
  field-compass-network:
    driver: bridge

volumes:
  postgres_data:


services:
  # Reverse proxy: TLS termination, static frontend, /api -> backend.
  # Caddy obtains and renews Let's Encrypt certificates automatically when
  # SITE_ADDRESS is a domain you control. See deploy/caddy/Caddyfile.
  caddy:
    image: caddy:2.8-alpine
    container_name: field-compass-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # A domain (https://app.example.org) gives real HTTPS.
      # ":80" serves plain HTTP -- demo only, passwords travel in clear.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # The marketing site (../site) on its own hostname, e.g.
      # https://fieldcompass.example.org while the app sits on app.*.
      # Defaults to :8081, which is not published below, so an unset value
      # leaves the deployment exactly as it was. See deploy/caddy/Caddyfile.
      WWW_ADDRESS: ${WWW_ADDRESS:-:8081}
      # Optional www.<domain> -> apex redirect, only relevant if the site is
      # served from here. Unset it binds :8082, which is not published.
      WWW_REDIRECT_FROM: ${WWW_REDIRECT_FROM:-:8082}
      # Only needed when VITE_API_URL is an absolute URL on another origin;
      # leave empty for the default same-origin "/api" setup. Must match that
      # origin exactly or the browser's CSP will block every API call.
      API_ORIGIN: ${API_ORIGIN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/usr/share/caddy/html:ro
      # Marketing site: plain static files, no build step. Bind-mounted, so
      # editing site/ and reloading Caddy is the whole deploy.
      - ./site:/usr/share/caddy/site:ro
      # These MUST persist: they hold the issued certificates and account key.
      # Losing them re-requests certs on every deploy and will hit Let's
      # Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      # must be service_completed_successfully: frontend-build is a one-shot
      # copy job, and service_started would let Caddy serve an empty webroot
      frontend-build:
        condition: service_completed_successfully
    networks:
      - field-compass-network

  # Build frontend static assets into a shared volume
  frontend-build:
    build:
      context: .
      dockerfile: ./deploy/frontend/Dockerfile
      args:
        # The API's ORIGIN. Empty means same-origin, which is correct behind the
        # bundled Caddy proxy; request paths already include the /api prefix.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: field-compass-frontend-build
    restart: "no"
    command: ["sh", "-c", "cp -r /app/dist/* /out/ && echo 'Frontend built'"]
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
    # Write built assets to shared volume
    volumes:
      - frontend_dist:/out
    networks:
      - field-compass-network

  # PostgreSQL Database (single-VM mode)
  postgres:
    image: postgres:15-alpine
    container_name: field-compass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-field_compass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - field-compass-network

  # Schema reconciliation, run once per deploy before the API starts.
  #
  # Postgres runs /docker-entrypoint-initdb.d ONLY on an empty data directory,
  # so editing schema.sql does nothing for a volume that already exists. Any
  # database created before a schema change keeps the old shape -- which is how
  # production ended up with no `users` table and a 500 on every login.
  #
  # The migration is idempotent, so running it on every deploy is a no-op once
  # the database is current.
  migrate:
    image: postgres:15-alpine
    container_name: field-compass-migrate
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
    volumes:
      - ./backend/database/migrations:/migrations:ro
    # ON_ERROR_STOP makes a failed migration a failed deploy, rather than
    # letting the API start against a half-migrated database.
    entrypoint:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-postgres}
      - -d
      - ${POSTGRES_DB:-field_compass}
      - -f
      - /migrations/006_sync_schema_with_models.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - field-compass-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: field-compass-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env - see .env.example}
      # Signs login tokens. Must be secret; rotating it logs everyone out.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env - see .env.example}
      # Encrypts stored Kobo API tokens. Must be a valid Fernet key.
      # Rotating it makes existing stored Kobo tokens unreadable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env - see .env.example}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_RULE_GEN_MODEL: ${OPENAI_RULE_GEN_MODEL:-gpt-5}
      OPENAI_QUAL_CHECK_MODEL: ${OPENAI_QUAL_CHECK_MODEL:-gpt-5-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Caddy sits in front, so per-client rate limiting must read
      # X-Forwarded-For rather than the proxy's own address.
      TRUST_PROXY_HEADERS: "true"
      # In single-VM mode, CORS can typically be your public domain(s)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    expose:
      - "8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - field-compass-network

  # Redis broker for async jobs
  redis:
    image: redis:7-alpine
    container_name: field-compass-redis
    restart: unless-stopped
    networks:
      - field-compass-network

  # Celery worker for qualitative checks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: field-compass-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env - see .env.example}
      # Signs login tokens. Must be secret; rotating it logs everyone out.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env - see .env.example}
      # Encrypts stored Kobo API tokens. Must be a valid Fernet key.
      # Rotating it makes existing stored Kobo tokens unreadable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env - see .env.example}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_RULE_GEN_MODEL: ${OPENAI_RULE_GEN_MODEL:-gpt-5}
      OPENAI_QUAL_CHECK_MODEL: ${OPENAI_QUAL_CHECK_MODEL:-gpt-5-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: celery -A services.job_queue.celery_app worker --loglevel=INFO -Q qualitative_checks
    networks:
      - field-compass-network

networks:
  field-compass-network:
    driver: bridge

volumes:
  postgres_data:
  frontend_dist:
  caddy_data:
  caddy_config:

